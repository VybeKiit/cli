# VybeKiit monorepo workspaces.
#
# Workspace members = code we develop, build, and gate here:
#   - packages/*    → MAINTAINED, published to npm as @vybekiit/* (headless logic)
#   - cli           → the `vybekiit` scaffolder
#   - templates/web → OWNED scaffold payload, but a real Next app we now build +
#     typecheck in CI so the reference app can't rot. On scaffold the CLI rewrites
#     its `@vybekiit/*` `workspace:*` deps → npm versions (see cli/src/rewrite-deps).
#   - templates/mobile → OWNED scaffold payload, a real Expo app we typecheck + test in CI.
#     It has no monorepo `build` task (Expo builds run remotely via EAS/launch).
#   - templates/extension → real WXT app; build + typecheck in CI (issue #20 scaffold)
#   - apps/landing → the VybeKiit store. A real Next.js marketing + checkout site that
#     dogfoods templates/web; now a workspace member in the gate (next build + tsc +
#     tests), joining alongside its real UI (issue #3, closing #2 — no more empty shell).
#
# Still excluded on purpose:
#   (none — extension WXT scaffold is now in the workspace gate)
packages:
  - "packages/*"
  - "cli"
  - "templates/web"
  - "templates/mobile"
  - "templates/extension"
  - "templates/backend"
  - "templates/spa"
  - "apps/landing"

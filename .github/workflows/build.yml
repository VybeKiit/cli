name: Build

# Reusable leg (workflow_call): turbo run build across every package, template, and
# app. A platform-path or codegen bug surfaces here (e.g. the component-library
# catalog is regenerated as part of its build). Single-leg (ubuntu, node 22).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack activates the pinned pnpm (package.json#packageManager); act-compatible.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # tsup DTS for large packages (e.g. @vybekiit/db) OOMs under default heap when
      # turbo runs many package builds in parallel on a GH-hosted runner.
      - run: pnpm exec turbo run build --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=8192

name: Build

# Reusable leg (workflow_call): turbo run build across every package, template, and
# app. A platform-path or codegen bug surfaces here (e.g. the component-library
# catalog is regenerated as part of its build). Single-leg (ubuntu, node 22).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

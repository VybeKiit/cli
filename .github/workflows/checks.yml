name: Checks

# Reusable leg (workflow_call): the repo-specific gates that `pnpm quality` runs
# after build — platform-skills audit, agent-config lint, template agent-layer, and
# provider-dispatch. These read source only (no build output), so they run as their
# own leg in parallel with build/test. Single-leg (ubuntu, node 22).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks (skills, agents, templates, dispatch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack activates the pinned pnpm (package.json#packageManager); act-compatible.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:platform-skills-audit

      - run: pnpm check:agent-configs

      - run: pnpm check:templates

      - run: pnpm check:provider-dispatch

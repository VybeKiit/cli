name: Checks

# Reusable leg (workflow_call): pure one-job yml for repo-specific static gates
# (dufflebag ADR-0009 shape) — platform-skills audit, agent-config lint,
# provider-dispatch, page-recipe index freshness, single-component-per-file.
# These read source only (no build output), so they run as their own leg in
# parallel with build/test. Single-leg (ubuntu, node 22).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks (skills, agents, dispatch, page-recipes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack activates the pinned pnpm (package.json#packageManager); act-compatible.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:platform-skills-audit

      - run: pnpm check:agent-configs

      - run: pnpm check:provider-dispatch

      - run: pnpm check:page-recipes

      - run: pnpm check:single-component

      # check:templates is intentionally NOT run in CI. It validates each
      # template's *pinned* platform skills (templates/*/.claude/skills — a
      # gitignored release artifact) through the built vybekiit CLI and a live
      # docs fetch, and pinning does an external `skills add` network fetch. A
      # cold checkout has neither the pinned skills nor the built CLI, so it can
      # only pass after a full build + external skill fetch on every run. It
      # stays in the local `pnpm verify` / pre-push gate, where the environment
      # is already pinned. See docs/agents for the pinning workflow.

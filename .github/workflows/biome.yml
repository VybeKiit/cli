name: Biome

# Reusable leg (workflow_call): biome does lint + format in one pass, so there is
# no separate lint/format leg. Deterministic across OS/Node, so it runs single-leg
# (ubuntu, node 22) — no matrix. Composed by ci.yml behind the CI Gate.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  biome:
    name: Lint & format (biome check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack activates the pinned pnpm from package.json#packageManager. It replaces
      # pnpm/action-setup here because that action's PATH edits break `act` locally (node
      # drops off PATH for the next step — nektos/act#107); corepack works in both.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

name: Deploy UI library

# Deploy apps/componentLibrary (the maintainer component-library browser + /changelog board) to a
# Cloudflare Worker via OpenNext — the same mechanism apps/landing uses (ADR-0028, ADR-0044).
# Enable by setting repo var CF_DEPLOY_UI_LIBRARY (any non-empty value) once the Cloudflare Worker
# (vybekiit-ui) + custom domain (ui.vybekiit.com) + Cloudflare Access gate are provisioned.
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/componentLibrary/**'
      - 'templates/web/src/components/**'
      - 'templates/web/.vybekiit/agent/ui-catalog-index.json'
      - 'scripts/dev/sync/buildComponentLibraryIndex.mjs'
      - 'scripts/dev/changelog/generateChangelog.mjs'
      - 'pnpm-lock.yaml'

concurrency:
  group: deploy-ui-library
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CF_DEPLOY_UI_LIBRARY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full git history so the changelog generator can read every release

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the OpenNext Worker and deploy it. cf:build regenerates the UI catalog indexes and the
      # /changelog board data (full git history + roadmap issues, ADR-0041 §4) before `next build`, so
      # the deployed board is always current; it degrades gracefully to an empty roadmap if gh is
      # unavailable. Needs fetch-depth: 0 (above) + issues: read for the roadmap.
      - name: Build + deploy Worker (OpenNext)
        run: pnpm --filter vybekiit-component-library cf:deploy
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

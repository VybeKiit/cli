name: Release

# Unified kit release: bump semver, tag monorepo, sync mirrors, tag mirrors, GitHub Release.
# npm publish is handled by publish.yml via workflow_run.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if release needed
        id: skip_check
        run: |
          if git describe --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged - skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release description
        if: steps.skip_check.outputs.skip != 'true'
        id: desc
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "title=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "title=Manual release" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump
        if: steps.skip_check.outputs.skip != 'true'
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name || '') }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${INPUT_BUMP:-patch}" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump kit version
        if: steps.skip_check.outputs.skip != 'true'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          CURRENT_TAG="v${CURRENT}"

          if git rev-parse "${CURRENT_TAG}" >/dev/null 2>&1; then
            echo "v${CURRENT} already tagged - bumping ${{ steps.bump.outputs.type }}"
            node scripts/dev/publish/bumpKitVersion.mjs "${{ steps.bump.outputs.type }}"
          else
            echo "v${CURRENT} not tagged yet - using as-is"
          fi

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag will be ${TAG}"

      # Cap turbo concurrency + heap: full-parallel typecheck/build OOMs GH-hosted
      # runners (runner shutdown signal → "operation was canceled").
      - run: pnpm lint
        if: steps.skip_check.outputs.skip != 'true'
      - name: Typecheck
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm exec turbo run typecheck --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Test
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm exec turbo run test --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: pnpm test:scripts
        if: steps.skip_check.outputs.skip != 'true'
      - name: Build
        if: steps.skip_check.outputs.skip != 'true'
        run: pnpm exec turbo run build --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build release notes from commits
        if: steps.skip_check.outputs.skip != 'true'
        id: notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "## What Changed"
            echo ""
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "**PR:** [#${PR_NUMBER} - ${PR_TITLE}](${PR_URL})"
            else
              echo "**Manual release triggered via workflow_dispatch**"
            fi
            echo "**Bump:** \`${BUMP_TYPE}\`"
            echo ""
            echo "### Commits"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit version bump and create tag
        if: steps.skip_check.outputs.skip != 'true'
        env:
          HUSKY: 0
        run: |
          # Nested lanes (packages/tools/*) and top-level packages/* both get version bumps.
          git add package.json cli/package.json
          git add packages/*/package.json packages/*/*/package.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          fi

          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }} - ${{ steps.desc.outputs.title }}"
          git push origin main --follow-tags

      - name: Pin platform skills
        if: steps.skip_check.outputs.skip != 'true'
        run: node scripts/dev/sync/pinPlatformSkills.mjs

      - name: Commit platform skill pins
        if: steps.skip_check.outputs.skip != 'true'
        env:
          HUSKY: 0
        run: |
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(release): pin platform skills for ${{ steps.version.outputs.tag }}"
            git push origin main
          fi

      - name: Create GitHub Release
        if: steps.skip_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} - ${{ steps.desc.outputs.title }}
          body: ${{ steps.notes.outputs.body }}

      - name: Check mirror token
        if: steps.skip_check.outputs.skip != 'true'
        id: mirror_guard
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          if [ -z "$GH_MIRROR_TOKEN" ]; then
            echo "::warning::GH_MIRROR_TOKEN not set — skipping mirror sync. See docs/release-ci-setup.md"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync delivery mirrors
        if: steps.skip_check.outputs.skip != 'true' && steps.mirror_guard.outputs.enabled == 'true'
        continue-on-error: true
        id: mirror_sync
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: pnpm mirror

      - name: Tag delivery mirrors
        if: steps.skip_check.outputs.skip != 'true' && steps.mirror_guard.outputs.enabled == 'true'
        continue-on-error: true
        id: mirror_tag
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/dev/mirror/tagMirrorRepos.mjs "${{ steps.version.outputs.tag }}"

      - name: Mirror sync summary
        if: >-
          steps.skip_check.outputs.skip != 'true' &&
          (steps.mirror_guard.outputs.enabled != 'true' ||
           steps.mirror_sync.outcome == 'failure' ||
           steps.mirror_tag.outcome == 'failure')
        run: |
          echo "::warning::Mirror sync incomplete. npm publish still proceeds. Set GH_MIRROR_TOKEN and run mirror-repos workflow."

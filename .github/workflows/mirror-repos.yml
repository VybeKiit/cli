# Mirrors monorepo paths → VybeKiit/* one-way, force (ADR-0005). For each delivery repo,
# `git subtree split` isolates its mapped prefix and force-pushes it to the matching
# mirror's main; the monorepo stays the single source of truth and mirrors are derived
# artifacts. Covers web/mobile/extension (templates), cli, and infra (skipped until #7
# creates its source).
#
# REQUIRES a `GH_MIRROR_TOKEN` repo secret: a PAT with `contents:write` on the mirror
# repos. The default GITHUB_TOKEN is scoped to THIS repo only, so it cannot push to the
# mirror repos. When the secret is absent (a fork or secret-less run) the job no-ops with
# a clear message instead of hard-failing.
name: mirror-repos

on:
  # Re-sync whenever mirrored source lands on main, so a buyer scaffolding mid-week gets
  # current code (not the last tagged release). Paths-filtered to skip unrelated commits.
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "cli/**"
      - "infra/**"
      - "scripts/mirror-repos.mjs"
      - "scripts/pin-platform-skills.mjs"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror token
        id: guard
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          if [ -z "$GH_MIRROR_TOKEN" ]; then
            echo "GH_MIRROR_TOKEN is not set — skipping mirror sync." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Pin platform skills
        if: steps.guard.outputs.enabled == 'true'
        run: node scripts/pin-platform-skills.mjs

      - name: Mirror repos
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: node scripts/mirror-repos.mjs

# Emergency/manual re-sync: monorepo paths → VybeKiit/* one-way, force (ADR-0005).
# Primary sync runs in the maintainer pre-push hook (after the quality gate). Use this
# workflow when hooks were skipped (`--no-verify`), a new machine has no husky, or mirror
# push failed mid-flight.
#
# REQUIRES a `GH_MIRROR_TOKEN` repo secret: a PAT with `contents:write` on the mirror
# repos. The default GITHUB_TOKEN is scoped to THIS repo only, so it cannot push to the
# mirror repos. When the secret is absent the job no-ops with a clear message instead
# of hard-failing.
name: mirror-repos

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror token
        id: guard
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          if [ -z "$GH_MIRROR_TOKEN" ]; then
            echo "GH_MIRROR_TOKEN is not set — skipping mirror sync." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Pin platform skills
        if: steps.guard.outputs.enabled == 'true'
        run: node scripts/pin-platform-skills.mjs

      - name: Mirror repos
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: node scripts/mirror-repos.mjs

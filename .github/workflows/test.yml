name: Test

# Reusable leg (workflow_call): the package test suites (turbo run test) plus the
# maintainer script suite (test:scripts). Kept together so one red test blocks the
# CI Gate. Single-leg (ubuntu, node 22); engines require node >=20.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests + script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # corepack activates the pinned pnpm (package.json#packageManager); act-compatible.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # browser-automation's field-locator suite launches a real Chromium (hermetic —
      # it drives local HTML via page.setContent, no network). The cold runner ships no
      # browser binaries, so install Chromium + its OS deps before the suite. Only this
      # one test file launches a browser, and only chromium, so we skip firefox/webkit.
      - run: pnpm --filter @vybekiit/browser-automation exec playwright install --with-deps chromium

      - run: pnpm exec turbo run test --concurrency=2
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - run: pnpm test:scripts

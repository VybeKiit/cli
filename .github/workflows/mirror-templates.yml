# Mirrors templates/* → VybeKiit/* one-way, force (ADR-0005). For each template,
# `git subtree split` isolates its subtree and force-pushes it to the matching mirror's
# main; the monorepo stays the single source of truth and mirrors are derived artifacts.
#
# REQUIRES a `GH_MIRROR_TOKEN` repo secret: a PAT with `contents:write` on the mirror
# repos. The default GITHUB_TOKEN is scoped to THIS repo only, so it cannot push to the
# mirror repos. When the secret is absent (a fork or secret-less run) the job no-ops with
# a clear message instead of hard-failing.
name: mirror-templates

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check mirror token
        id: guard
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          if [ -z "$GH_MIRROR_TOKEN" ]; then
            echo "GH_MIRROR_TOKEN is not set — skipping mirror sync." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 22

      - name: Configure git
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Mirror templates
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: node scripts/mirror-templates.mjs

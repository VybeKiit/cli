# Field check — real-user Core Web Vitals from the Chrome UX Report (CrUX) API.
# Mobile (PHONE) is the primary gate; desktop is reported for completeness.
# Requires:
#   - secret   PSI_API_KEY     (Google key with Chrome UX Report API + PageSpeed Insights API)
#   - variable PSI_TARGET_URL  (production landing URL for scheduled runs)
name: Field check (Core Web Vitals)

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL to check (defaults to PSI_TARGET_URL)
        required: false
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  field-mobile:
    name: Field (mobile / PHONE)
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target URL
        id: target
        run: |
          URL="${{ github.event.inputs.url || github.event.deployment_status.target_url || vars.PSI_TARGET_URL }}"
          if [ -z "$URL" ]; then
            echo "No target URL — set vars.PSI_TARGET_URL or pass workflow_dispatch url."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: CrUX field check (PHONE)
        run: node .github/perf/runCrux.mjs "${{ steps.target.outputs.url }}" --form-factor=PHONE --budgets=.github/perf/budgets.json
        env:
          CRUX_API_KEY: ${{ secrets.PSI_API_KEY }}

  field-desktop:
    name: Field (desktop)
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target URL
        id: target
        run: |
          URL="${{ github.event.inputs.url || github.event.deployment_status.target_url || vars.PSI_TARGET_URL }}"
          if [ -z "$URL" ]; then
            echo "No target URL — set vars.PSI_TARGET_URL or pass workflow_dispatch url."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: CrUX field check (DESKTOP)
        run: node .github/perf/runCrux.mjs "${{ steps.target.outputs.url }}" --form-factor=DESKTOP --budgets=.github/perf/budgets.json
        env:
          CRUX_API_KEY: ${{ secrets.PSI_API_KEY }}

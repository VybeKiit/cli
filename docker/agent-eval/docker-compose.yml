# Multi-agent dogfood: one isolated environment per coding agent.
# Orchestrated by scripts/dev/agent-eval/run.mjs — prefer that entry over raw compose.
#
# Host env: RUN_ID, RUNS_ROOT, KIT_MODE, AGENT_EVAL_MODE, AGENT_EVAL_TIMEOUT_HOURS,
#           MONOREPO_ROOT, optional GH_TOKEN_* / provider keys via secrets/env.agent-eval

services:
  agent-claude:
    build:
      context: ../..
      dockerfile: docker/agent-eval/Dockerfile
    image: vybekiit-agent-eval:latest
    profiles: ["claude", "all"]
    env_file:
      - path: ./secrets/env.agent-eval
        required: false
    environment:
      AGENT_EVAL_MODE: ${AGENT_EVAL_MODE:-full}
      AGENT_EVAL_KIT_MODE: ${KIT_MODE:-local-kit}
      AGENT_EVAL_TIMEOUT_HOURS: ${AGENT_EVAL_TIMEOUT_HOURS:-6}
      AGENT_EVAL_RUN_ID: ${RUN_ID:-local}
      VYBEKIIT_CLI_PIN: ${VYBEKIIT_CLI_PIN:-latest}
      LOCAL_CLI_PATH: /kit-source/cli/dist/bin.js
      LOCAL_KIT_ROOT: /kit-source
      AGENT_ID: claude-code
      AGENT_SLUG: claude
      GH_TOKEN: ${GH_TOKEN_CLAUDE:-${GH_TOKEN:-}}
    volumes:
      - ${MONOREPO_ROOT:-../..}:/kit-source:ro
      - ${RUNS_ROOT}/${RUN_ID}/claude/workspace:/workspace
      - ${RUNS_ROOT}/${RUN_ID}/claude/logs:/logs
      - ${RUNS_ROOT}/${RUN_ID}/claude/artifacts:/artifacts
    ports:
      - "4101:3000"
      - "4111:3001"
    networks:
      - agent-eval
    mem_limit: 8g
    cpus: 4.0

  agent-codex:
    build:
      context: ../..
      dockerfile: docker/agent-eval/Dockerfile
    image: vybekiit-agent-eval:latest
    profiles: ["codex", "all"]
    env_file:
      - path: ./secrets/env.agent-eval
        required: false
    environment:
      AGENT_EVAL_MODE: ${AGENT_EVAL_MODE:-full}
      AGENT_EVAL_KIT_MODE: ${KIT_MODE:-local-kit}
      AGENT_EVAL_TIMEOUT_HOURS: ${AGENT_EVAL_TIMEOUT_HOURS:-6}
      AGENT_EVAL_RUN_ID: ${RUN_ID:-local}
      VYBEKIIT_CLI_PIN: ${VYBEKIIT_CLI_PIN:-latest}
      LOCAL_CLI_PATH: /kit-source/cli/dist/bin.js
      LOCAL_KIT_ROOT: /kit-source
      AGENT_ID: codex
      AGENT_SLUG: codex
      GH_TOKEN: ${GH_TOKEN_CODEX:-${GH_TOKEN:-}}
    volumes:
      - ${MONOREPO_ROOT:-../..}:/kit-source:ro
      - ${RUNS_ROOT}/${RUN_ID}/codex/workspace:/workspace
      - ${RUNS_ROOT}/${RUN_ID}/codex/logs:/logs
      - ${RUNS_ROOT}/${RUN_ID}/codex/artifacts:/artifacts
    ports:
      - "4102:3000"
      - "4112:3001"
    networks:
      - agent-eval
    mem_limit: 8g
    cpus: 4.0

  agent-grok:
    build:
      context: ../..
      dockerfile: docker/agent-eval/Dockerfile
    image: vybekiit-agent-eval:latest
    profiles: ["grok", "all"]
    env_file:
      - path: ./secrets/env.agent-eval
        required: false
    environment:
      AGENT_EVAL_MODE: ${AGENT_EVAL_MODE:-full}
      AGENT_EVAL_KIT_MODE: ${KIT_MODE:-local-kit}
      AGENT_EVAL_TIMEOUT_HOURS: ${AGENT_EVAL_TIMEOUT_HOURS:-6}
      AGENT_EVAL_RUN_ID: ${RUN_ID:-local}
      VYBEKIIT_CLI_PIN: ${VYBEKIIT_CLI_PIN:-latest}
      LOCAL_CLI_PATH: /kit-source/cli/dist/bin.js
      LOCAL_KIT_ROOT: /kit-source
      AGENT_ID: grok
      AGENT_SLUG: grok
      GH_TOKEN: ${GH_TOKEN_GROK:-${GH_TOKEN:-}}
    volumes:
      - ${MONOREPO_ROOT:-../..}:/kit-source:ro
      - ${RUNS_ROOT}/${RUN_ID}/grok/workspace:/workspace
      - ${RUNS_ROOT}/${RUN_ID}/grok/logs:/logs
      - ${RUNS_ROOT}/${RUN_ID}/grok/artifacts:/artifacts
    ports:
      - "4103:3000"
      - "4113:3001"
    networks:
      - agent-eval
    mem_limit: 8g
    cpus: 4.0

networks:
  agent-eval:
    driver: bridge

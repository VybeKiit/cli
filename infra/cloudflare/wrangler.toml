# VybeKiit edge security Worker — wrangler config (deploy tool: wrangler, per ADR-0001).
#
# This is the EDGE half of the kit's security story. The app half lives in
# `packages/security` (a per-instance in-memory guard inside the running app). Both read
# the SAME env toggles — the `SECURITY_*` keys defined once in
# `packages/core/src/config.ts` (`securityConfigSchema`) — so the edge and the app can
# never enforce different rules. See `infra/README.md` for the full picture.
#
# Secrets rule: NOTHING secret lives here. `CLOUDFLARE_ACCOUNT_ID` /
# `CLOUDFLARE_API_TOKEN` (the deploy creds in `cloudflareConfigSchema`) are supplied to
# `wrangler` via the environment at deploy time, never committed. The `[vars]` below are
# non-secret policy toggles only.

name = "vybekiit-edge-security"
main = "security-worker.ts"

# Pin the runtime date so behaviour is reproducible across redeploys. Bump deliberately.
compatibility_date = "2026-06-29"

# Account is read from the CLOUDFLARE_ACCOUNT_ID env var at deploy time (not hardcoded).
# wrangler picks it up automatically; documented here so a maintainer knows the source.
# account_id is intentionally omitted — set CLOUDFLARE_ACCOUNT_ID in the deploy env.

# --- Security policy toggles (the SSOT, surfaced to the Worker as `env`) -----------------
#
# These mirror, key-for-key, the core `securityConfigSchema` defaults. `security-worker.ts`
# reads them via its `env` argument and applies the SAME secure-by-default logic as
# `@vybekiit/security` (origin lock on state-changing methods, then per-IP fixed-window
# rate limit). A blank/absent value means "use the safe default", never "fail open".
#
# Override per environment with `wrangler deploy --var KEY:value` or per-env `[env.*.vars]`
# blocks, or pull them from your `.env` so all three layers (core, app, edge) agree.
[vars]
SECURITY_RATE_LIMIT = "on"               # on|off — master switch for the per-IP rate limit
SECURITY_RATE_LIMIT_MAX = "60"           # positive int — max requests per window per client IP
SECURITY_RATE_LIMIT_WINDOW_SECONDS = "60" # positive int — window length in seconds
SECURITY_ORIGIN_LOCK = "on"              # on|off — reject cross-site state-changing requests
SECURITY_ALLOWED_ORIGINS = ""            # CSV of extra allowed origins; blank = same-origin only
# APP_URL is the app's own canonical origin the origin lock compares against. Defaults to
# http://localhost:3000 (core DEFAULT_APP_URL) when unset; set it to your production origin.
APP_URL = "http://localhost:3000"

# --- Routes ------------------------------------------------------------------------------
#
# Attach this Worker in front of the app's state-changing surface (auth + checkout are the
# routes the app-layer guard protects). Uncomment and set your zone's pattern at go-live;
# the kit's go-live skill (`@vybekiit/deploy`, Cloudflare adapter) wires this for the buyer.
# routes = [
#   { pattern = "app.example.com/api/*", zone_name = "example.com" },
#   { pattern = "app.example.com/auth/*", zone_name = "example.com" },
# ]

# --- Where the heavy, distributed rate-limit rule attaches -------------------------------
#
# The Worker above gives a programmable cap scoped to one edge isolate — the exact mirror
# of the app policy. For a STRICT cross-edge cap (counting one IP across all of
# Cloudflare's network), attach a Cloudflare Rate-Limiting Ruleset, driven by the SAME
# `SECURITY_RATE_LIMIT_MAX` / `_WINDOW_SECONDS` values. Rulesets are account/zone config,
# not Worker code, so they are provisioned via the API/Terraform by the deploy script that
# lands with issue #7. The intended shape (documented, not yet automated) is:
#
#   {
#     "kind": "zone",
#     "phase": "http_ratelimit",
#     "rules": [
#       {
#         "action": "block",                       // 429 once the threshold is crossed
#         "ratelimit": {
#           "characteristics": ["ip.src"],         // per client IP, matching CF-Connecting-IP
#           "period": <SECURITY_RATE_LIMIT_WINDOW_SECONDS>,
#           "requests_per_period": <SECURITY_RATE_LIMIT_MAX>,
#           "mitigation_timeout": <SECURITY_RATE_LIMIT_WINDOW_SECONDS>
#         },
#         // Scope to state-changing methods only, so safe reads aren't capped — same rule
#         // as the app guard's origin lock applying only to POST/PUT/PATCH/DELETE.
#         "expression": "(http.request.method in {\"POST\" \"PUT\" \"PATCH\" \"DELETE\"})"
#       }
#     ]
#   }
#
# A complementary WAF custom rule expresses the origin allow-list at the edge, again from
# the same toggles (block state-changing requests whose Origin is neither the app's own
# origin nor in SECURITY_ALLOWED_ORIGINS):
#
#   {
#     "kind": "zone",
#     "phase": "http_request_firewall_custom",
#     "rules": [
#       {
#         "action": "block",
#         "expression": "(http.request.method in {\"POST\" \"PUT\" \"PATCH\" \"DELETE\"}) and (len(http.request.headers[\"origin\"]) > 0) and not (http.request.headers[\"origin\"][0] in {\"https://app.example.com\"}))"
#       }
#     ]
#   }
#
# Until issue #7 automates provisioning, the Worker is the active edge enforcement and
# these Rulesets are the documented next step — same numbers, same policy, no divergence.

# --- Observability -----------------------------------------------------------------------
# Surface blocked-request logs so a maintainer can see the edge layer working. Off by
# default to avoid cost surprises for a non-coder; flip on when investigating abuse.
# [observability]
# enabled = true

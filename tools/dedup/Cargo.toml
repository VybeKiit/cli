[package]
name = "vybekiit-dedup"
version = "0.1.0"
edition = "2021"
description = "Blazing-fast deduplication gate for VybeKiit — detects exact, structural, and concern-overlap duplicates in TypeScript codebases"
license = "MIT"
publish = false

[[bin]]
name = "vybekiit-dedup"
path = "src/main.rs"

[lib]
name = "vybekiit_dedup"
path = "src/lib.rs"

[dependencies]
# SWC for TypeScript AST parsing
swc_ecma_parser = "41.1.2"
swc_ecma_ast = "25.0.0"
swc_common = { version = "23.0.2", features = ["sourcemap"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing (for body hashes and skeleton hashes)
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Fuzzy matching (Levenshtein for name similarity)
strsim = "0.11"

# File walking
walkdir = "2.5"

# Globbing (for gitignore-aware scanning)
ignore = "0.4"

# TTY detection
atty = "0.2"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
